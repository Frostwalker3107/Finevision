# ==================================================
# APPLICATION
# ==================================================

spring.application.name=finevision-backend

# ==================================================
# SERVER
# ==================================================

server.address=127.0.0.1
server.port=8080

# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Schema is provisioned by schema.sql before Hibernate validates entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# API CONFIGURATION
# ==================================================

arthsankalan.api.base-path=/api/v1

# ==================================================
# API ERROR SECURITY
# ==================================================

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ==================================================
# LOGGING
# ==================================================

logging.level.root=INFO
logging.level.com.finevision.backend=DEBUG

logging.config=classpath:log4j2-spring.xml

# ==================================================
# CORS
# ==================================================

arthsankalan.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173


# ==================================================
# Graceful shutdown
# ==================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s